name: "Deploy Dev Infrastructure"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

jobs:
  plan:
    name: "Terraform Plan"
    runs-on: "ubuntu-latest"
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: install terraform
        uses: hashicorp/setup-terraform@v4
      - name: terraform init
        run: terraform -chdir=infrastructure/environments/sandbox/bsr_env init -backend-config=bsr_env.tfbackend
      - name: terraform plan
        run: terraform -chdir=infrastructure/environments/sandbox/bsr_env plan -var-file=bsr_env.tfvars

  apply:
    name: "Terraform Apply"
    runs-on: "ubuntu-latest"
    needs: [plan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: install terraform
        uses: hashicorp/setup-terraform@v4
      - name: terraform init
        run: terraform -chdir=infrastructure/environments/sandbox/bsr_env init -backend-config=bsr_env.tfbackend
      - name: terraform apply
        run: terraform -chdir=infrastructure/environments/sandbox/bsr_env apply -auto-approve -var-file=bsr_env.tfvars

