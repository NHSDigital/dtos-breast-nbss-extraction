name: "Lint Terraform"
description: "Lint Terraform"
inputs:
  root-modules:
    description: "Comma separated list of root module directories to validate, content of the 'infrastructure/environments' is checked by default"
    required: false
runs:
  using: "composite"
  steps:
    - name: "Resolve Terraform version"
      id: terraform-version
      shell: bash
      run: |
        version=$(awk '/^terraform[[:space:]]+/ { print $2; exit }' .tool-versions)
        if [ -z "$version" ]; then
          echo "Could not find terraform version in .tool-versions" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: "Set up Terraform"
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ steps.terraform-version.outputs.version }}
    - name: "Check Terraform format"
      shell: bash
      run: |
        check_only=true scripts/githooks/check-terraform-format.sh
    - name: "Validate Terraform"
      shell: bash
      run: |
        stacks=${{ inputs.root-modules }}
        for dir in $(find infrastructure/environments -type f -name '*.tf' -exec dirname {} \; | sort -u; echo ${stacks//,/$'\n'}); do
          dir=$dir opts="-backend=false" make terraform-init
          dir=$dir make terraform-validate
        done
